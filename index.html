<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcador Retro LED - Pantalla Principal</title>
    <!-- Importamos Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght=700&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Courier Prime', 'Courier', monospace;
        }

        body {
            margin: 0;
            background-color: #060606;
            color: #00ff66;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* --- PANTALLA LED --- */
        .tablero-led {
            background-color: #000000;
            border: 8px solid #222;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 750px;
            box-shadow: inset 0 0 40px rgba(0,0,0,1), 0 0 30px rgba(0, 255, 100, 0.1);
            text-align: center;
            position: relative;
        }

        .tablero-led::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 6px 100%;
            z-index: 10;
            pointer-events: none;
        }

        .en-vivo-badg {
            color: #220000;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .en-vivo-active {
            color: #ff0033 !important;
            text-shadow: 0 0 15px #ff0033, 0 0 30px #ff0033;
            animation: parpadeo 1.5s infinite;
        }

        @keyframes parpadeo {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .pantalla-principal {
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 3px double #333;
            padding-bottom: 20px;
            margin-bottom: 15px;
        }

        .equipo-caja {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- CONTENEDOR DE ESCUDO --- */
        .escudo-led {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed #222;
            border-radius: 8px;
            overflow: hidden;
            padding: 5px;
            transition: all 0.5s ease;
        }

        .escudo-led img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.4));
        }

        .led-nombre {
            font-size: 1.8rem;
            color: #ff9900;
            text-shadow: 0 0 8px rgba(255, 153, 0, 0.6);
            text-transform: uppercase;
        }

        .led-goles {
            font-size: 6.5rem;
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.8);
            font-weight: bold;
            margin: 10px 0;
        }

        .separador-led {
            font-size: 4rem;
            color: #444;
            align-self: center;
            margin-top: 50px;
        }

        .consola-eventos {
            background-color: #030303;
            border: 2px solid #151515;
            padding: 15px;
            min-height: 55px;
            color: #ffcc00;
            font-size: 1.2rem;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
            margin-bottom: 10px;
        }

        .btn-ir-vivo {
            display: none;
            background-color: #ff0033;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 5px;
            margin: 15px 0 5px 0;
            text-shadow: 0 0 5px #fff;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.8);
            animation: latido 1s infinite alternate;
            text-transform: uppercase;
        }

        @keyframes latido {
            from { transform: scale(1); box-shadow: 0 0 10px rgba(255, 0, 51, 0.6); }
            to { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 0, 51, 1); }
        }

        .secciones-contenedor {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 750px;
            margin-top: 25px;
        }

        .columna-info {
            flex: 1;
            background: #0d0d0d;
            border: 2px solid #222;
            border-radius: 8px;
            padding: 15px;
        }

        .columna-titulo {
            color: #ff9900;
            font-size: 1.1rem;
            text-transform: uppercase;
            border-bottom: 2px solid #222;
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-align: center;
        }

        .fila-item {
            background: #111;
            border-left: 3px solid #00ff66;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .proximos-item {
            border-left: 3px solid #ffcc00;
            flex-direction: column;
            align-items: flex-start;
        }

        .proximos-fecha {
            color: #888;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        /* --- CUENTA REGRESIVA --- */
        .cuenta-regresiva {
            color: #00ffff;
            font-size: 0.85rem;
            margin-top: 5px;
            font-weight: bold;
            background: rgba(0, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px dashed rgba(0, 255, 255, 0.2);
            width: 100%;
            box-sizing: border-box;
        }

        .historial-equipos {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-escudo {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            .secciones-contenedor {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        
        <!-- Tablero LED -->
        <div class="tablero-led">
            <div id="led-envivo" class="en-vivo-badg">● EN VIVO</div>

            <div class="pantalla-principal">
                <!-- LOCAL -->
                <div class="equipo-caja">
                    <div class="escudo-led">
                        <img id="escudo-local" src="" alt="" style="display: none;">
                    </div>
                    <div id="nombre-local" class="led-nombre">LOCAL</div>
                    <div id="goles-local" class="led-goles">0</div>
                </div>

                <div class="separador-led">:</div>

                <!-- VISITA -->
                <div class="equipo-caja">
                    <div class="escudo-led">
                        <img id="escudo-visita" src="" alt="" style="display: none;">
                    </div>
                    <div id="nombre-visita" class="led-nombre">VISITA</div>
                    <div id="goles-visita" class="led-goles">0</div>
                </div>
            </div>

            <!-- Pantalla LED para eventos -->
            <div id="pantalla-evento" class="consola-eventos">
                BIENVENIDOS AL ENCUENTRO
            </div>

            <a href="#" id="boton-ir-vivo" class="btn-ir-vivo" onclick="hacerFocoVivo(event)">⚡ IR AL MARCADOR EN VIVO ⚡</a>
        </div>

        <div class="secciones-contenedor">
            <div class="columna-info">
                <div class="columna-titulo">📅 Próximos Partidos</div>
                <div id="lista-proximos"></div>
            </div>

            <div class="columna-info">
                <div class="columna-titulo">🏆 Historial Reciente</div>
                <div id="lista-historial"></div>
            </div>
        </div>
    </div>

    <!-- Script del Motor de Escudos Inteligente -->
    <script src="escudos.js"></script>

    <script>
        // === CONFIGURACIÓN DE TU FIREBASE INTEGRADA ===
        const firebaseConfig = {
            apiKey: "AIzaSyAz_mMX5qGD5DRjxBdD9OvD9v9SvNi5mcM",
            authDomain: "marcoadro-de-ffutbol.firebaseapp.com",
            databaseURL: "https://marcoadro-de-ffutbol-default-rtdb.firebaseio.com",
            projectId: "marcoadro-de-ffutbol",
            storageBucket: "marcoadro-de-ffutbol.firebasestorage.app",
            messagingSenderId: "243577100993",
            appId: "1:243577100993:web:c967e07785350e5dc49240"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const refMarcador = db.ref('marcador_v3_datos');
        const refHistorial = db.ref('marcador_v3_historial');
        const refProximos = db.ref('marcador_v3_proximos');

        // Escuchar datos del partido actual
        refMarcador.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const localNombre = data.nombreA || "LOCAL";
                const visitaNombre = data.nombreB || "VISITA";

                document.getElementById('nombre-local').innerText = localNombre;
                document.getElementById('nombre-visita').innerText = visitaNombre;
                document.getElementById('goles-local').innerText = data.golesA || 0;
                document.getElementById('goles-visita').innerText = data.golesB || 0;
                document.getElementById('pantalla-evento').innerHTML = data.ultimoEvento || "S/D";
                
                // Actualizar los escudos en vivo
                cargarEscudoHTML(localNombre, 'escudo-local');
                cargarEscudoHTML(visitaNombre, 'escudo-visita');

                const badg = document.getElementById('led-envivo');
                const btnVivo = document.getElementById('boton-ir-vivo');
                if (data.enVivo) {
                    badg.classList.add('en-vivo-active');
                    btnVivo.style.display = 'inline-block';
                } else {
                    badg.classList.remove('en-vivo-active');
                    btnVivo.style.display = 'none';
                }
            }
        });

        // Intervalos para actualizar las cuentas regresivas
        let intervaloReloj;

        // Escuchar programados
        refProximos.on('value', (snapshot) => {
            const data = snapshot.val();
            const contenedorMarcador = document.getElementById('lista-proximos');
            contenedorMarcador.innerHTML = "";

            if (intervaloReloj) clearInterval(intervaloReloj);

            if (data) {
                const proximosPartidos = [];

                Object.keys(data).forEach(key => {
                    const p = data[key];
                    const urlEscudoLocal = obtenerUrlEscudo(p.local);
                    const urlEscudoVisita = obtenerUrlEscudo(p.visita);
                    const idContador = `reloj-${key}`;

                    proximosPartidos.push({
                        idElemento: idContador,
                        fechaDestino: p.fechaISO // Usamos el formato ISO que guarda el panel
                    });

                    // Mostramos la fecha amigable que guardamos
                    contenedorMarcador.innerHTML += `
                        <div class="fila-item proximos-item">
                            <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
                                <img src="${urlEscudoLocal}" class="mini-escudo" onerror="this.style.display='none'">
                                <strong style="color: #ff9900;">${p.local} VS ${p.visita}</strong>
                                <img src="${urlEscudoVisita}" class="mini-escudo" onerror="this.style.display='none'">
                            </div>
                            <span class="proximos-fecha">📅 ${p.fecha}</span>
                            <div id="${idContador}" class="cuenta-regresiva">Calculando tiempo...</div>
                        </div>
                    `;
                });

                // Función que actualiza todos los relojes cada 1 segundo
                function actualizarTodosLosRelojes() {
                    const ahora = new Date().getTime();

                    proximosPartidos.forEach(partido => {
                        const elemento = document.getElementById(partido.idElemento);
                        if (!elemento) return;

                        const tiempoLimite = new Date(partido.fechaDestino).getTime();
                        const diferencia = tiempoLimite - ahora;

                        if (isNaN(tiempoLimite) || tiempoLimite <= 0) {
                            elemento.innerText = "⏰ ¡Falta muy poco!";
                            return;
                        }

                        if (diferencia < 0) {
                            elemento.innerText = "🔥 ¡EL PARTIDO YA DEBERÍA HABER EMPEZADO!";
                            elemento.style.color = "#ff0033";
                            elemento.style.background = "rgba(255, 0, 51, 0.05)";
                            elemento.style.borderColor = "rgba(255, 0, 51, 0.2)";
                        } else {
                            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
                            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
                            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

                            let textoRegresivo = "⏳ ";
                            if (dias > 0) textoRegresivo += `${dias}d `;
                            textoRegresivo += `${horas.toString().padStart(2, '0')}h ${minutos.toString().padStart(2, '0')}m ${segundos.toString().padStart(2, '0')}s`;

                            elemento.innerText = textoRegresivo;
                        }
                    });
                }

                actualizarTodosLosRelojes();
                intervaloReloj = setInterval(actualizarTodosLosRelojes, 1000);

            } else {
                contenedorMarcador.innerHTML = "<div style='color: #444; text-align: center;'>No hay partidos agendados</div>";
            }
        });

        // Escuchar historial
        refHistorial.on('value', (snapshot) => {
            const lista = document.getElementById('lista-historial');
            lista.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                const partidos = Object.keys(data).map(key => data[key]).reverse();
                partidos.forEach(p => {
                    const urlLocal = obtenerUrlEscudo(p.nombreA);
                    const urlVisita = obtenerUrlEscudo(p.nombreB);

                    lista.innerHTML += `
                        <div class="fila-item">
                            <div class="historial-equipos">
                                <img src="${urlLocal}" class="mini-escudo" onerror="this.style.display='none'">
                                <span>${p.nombreA} <strong>${p.golesA} - ${p.golesB}</strong> ${p.nombreB}</span>
                                <img src="${urlVisita}" class="mini-escudo" onerror="this.style.display='none'">
                            </div>
                            <small style="color: #444; font-size: 0.75rem;">(${p.hora})</small>
                        </div>
                    `;
                });
            } else {
                lista.innerHTML = "<div style='color: #444; text-align: center;'>No hay partidos jugados</div>";
            }
        });

        function hacerFocoVivo(e) {
            e.preventDefault();
            const elementoTablero = document.querySelector('.tablero-led');
            elementoTablero.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
